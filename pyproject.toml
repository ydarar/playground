[project]
name = "google-workspace-multi-account"
version = "0.1.0"
description = "Multi-account Google Workspace integration (Gmail, Calendar)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.130.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.1.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
