<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Workspace Hub{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/inbox">Workspace Hub</a>
        </div>
        <div class="nav-links">
            <a href="/inbox" class="{% if request.url.path.startswith('/inbox') or request.url.path == '/' %}active{% endif %}">Inbox</a>
            <a href="/compose" class="{% if request.url.path.startswith('/compose') %}active{% endif %}">Compose</a>
            <a href="/calendar" class="{% if request.url.path.startswith('/calendar') %}active{% endif %}">Calendar</a>
            <a href="/accounts" class="{% if request.url.path.startswith('/accounts') %}active{% endif %}">Accounts</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
